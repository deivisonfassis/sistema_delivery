<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cadasstro de Pedido - Delivery</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        padding: 20px;
      }

      /* BUG VISUAL 1: O contraste de cores torna o texto ilegível (branco no amarelo claro) */
      .painel {
        background-color: #000000;
        color: #ffffff;
        padding: 25px;
        border-radius: 8px;
        max-width: 400px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .grupo-input {
        margin-bottom: 15px;
      }
      input[type="number"],
      select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
      }

      .btn-comprar {
        background-color: #23b745;
        color: #e3ece5;
        border: none;
        padding: 12px;
        width: 100%;
        cursor: pointer;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="painel">
      <h2>Resumo do Pedido</h2>

      <form>
        <div class="grupo-input">
          <label>Valor do Lanche (R$):</label>
          <input type="number" id="valorLanche"  value="0" />
        </div>

        <div class="grupo-input">
          <label>Bairro para entrega:</label>
          <select id="valorFrete">
            <option value="10">Centro (R$ 10,00)</option>
            <option value="15">Zona Sul (R$ 15,00)</option>
          </select>
        </div>

        <div class="grupo-input">
          <input type="checkbox" id="cupomDesconto" /> Adicionar cupom
          promocional (- R$ 5,00)
        </div>

        <button type="button" class="btn-comprar" onclick="gerarFatura()">
          Confirmar Pedido
        </button>
      </form>

      <h3 id="resultado"></h3>
    </div>

    <script>
      function gerarFatura() {
        let lanche = parseFloat(document.getElementById("valorLanche").value);
        let frete = parseFloat(document.getElementById("valorFrete").value);
        let aplicouCupom = document.getElementById("cupomDesconto").checked;

        if (lanche < 0) {
          
          alert("Excessão a Regra: O valor do lanche não pode ser negativo.");
          return;
        }

        let total = lanche + frete;

        if (aplicouCupom) {
          total = total - 5;
        }

        document.getElementById("resultado").style.color = "red";
        document.getElementById("resultado").innerText =
          "Total a Pagar: R$ " + total.toFixed(2);
      }
    </script>
  </body>
</html>
